name: KobentoShowcases
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: dev.kobento
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  KobentoShowcases:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Player/KobentoShowcases-Bridging-Header.h"   # SWIFT_OBJC_BRIDGING_HEADER
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kobento
        UILaunchScreen:
          UIColorName: ""
        # Full speed on ProMotion screens (120 Hz), not iOS's default 60 for apps.
        CADisableMinimumFrameDurationOnPhone: YES
        # The server to sign in to (-server <url> at launch names another, for tests).
        KobentoServer: $(KOBENTO_SERVER)
        # Plain HTTP to localhost only: a local test server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kobento.showcases
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Player/KobentoShowcases-Bridging-Header.h
        KOBENTO_SERVER: https://mcp.kobento.dev
        # The showcases come from kobento-mcp's example catalog, a sibling checkout.
        KOBENTO_MCP: "$(SRCROOT)/../../kobento-mcp"
        # The engine, the Skia bridge and Skia: kobento-ios's ios/ build, a sibling checkout, for a
        # device or the Simulator ((cd ../../kobento-ios/ios && ./build.sh) and ./build.sh sim).
        KOBENTO_IOS: "$(SRCROOT)/../../kobento-ios"
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(KOBENTO_IOS)/ios/output/include"
          - "$(KOBENTO_IOS)/ios/build/_deps/skia-src"
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(KOBENTO_IOS)/ios/output-sim/include"
          - "$(KOBENTO_IOS)/ios/build-sim/_deps/skia-src"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(KOBENTO_IOS)/ios/output/lib"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(KOBENTO_IOS)/ios/output-sim/lib"
        OTHER_LDFLAGS:
          - "-lz"
          - "-lrccore"
          - "-lrcskia"
          - "-lskia"
          - "-lskshaper"
          - "-lskunicode_icu"
          - "-lskunicode_core"
          - "-lharfbuzz"
          - "-licu"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
    postCompileScripts:
      - name: Copy the showcases
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$KOBENTO_MCP/examples"
          if [ ! -d "$SRC" ]; then
            echo "error: no showcases at $SRC: check out kobento-mcp next to kobento-tools"; exit 1
          fi
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$OUT/showcases"
          rsync -a --delete --prune-empty-dirs \
            --include='SHW-*/' --include='doc.rc' --include='doc.mono-dark.rc' --include='doc.mono-light.rc' \
            --include='render-light.png' --include='render-dark.png' --include='meta.json' --exclude='*' \
            "$SRC/" "$OUT/showcases/"
          cp "$KOBENTO_MCP/docs/examples-vocabulary.json" "$OUT/"
    scheme:
      testTargets:
        - KobentoShowcasesUITests
    dependencies:
      - sdk: UIKit.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: ImageIO.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AuthenticationServices.framework

  # Drives the app against a local Kobento server: sign in, share a page, vote. Runs only with
  # KOBENTO_TOKEN (a test account's token) set; see README.md.
  KobentoShowcasesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: KobentoShowcases
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kobento.showcases.uitests
        GENERATE_INFOPLIST_FILE: YES
