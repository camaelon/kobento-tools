org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true

# The androidx.dev build the RemoteCompose player snapshot comes from (https://androidx.dev/snapshots/builds).
# The showcases use operations newer than the last alpha, so the app plays androidx-main's player; to
# move to a newer one, put the build id of https://androidx.dev/snapshots/latest here.
androidxSnapshotBuild=16844723
# The player version: 1.0.0-SNAPSHOT (that build), or a release such as 1.0.0-alpha23 from Google Maven
# (./gradlew -PremoteVersion=1.0.0-alpha23 ...), which cannot play every showcase.
remoteVersion=1.0.0-SNAPSHOT
